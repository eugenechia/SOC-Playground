<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">{{ app_name }}</div>
    <nav class="nav">
      <a href="/models" class="{{ 'active' if nav == 'models' else '' }}">Models</a>
      <a href="/workbench" class="{{ 'active' if nav == 'workbench' else '' }}">Workbench</a>
      <a href="/scorecard" class="{{ 'active' if nav == 'scorecard' else '' }}">Scorecard</a>
    </nav>
    <form method="post" action="/logout" class="signout">
      <button type="submit" class="btn-secondary">Sign out</button>
    </form>
  </header>
  <main class="content">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
