# SOC-Playground task registry.
#
# A task frames an experiment: system prompt + starter prompts. In Phase 1
# `tools` is ALWAYS empty (pure chat). Phase 2 will add real tool ids here and
# resolve them in models_engine/tasks.py::resolve_tools — no other change needed.

tasks:
  - id: crowdstrike-falcon
    name: CrowdStrike Falcon
    description: >
      Threat-hunting assistant framed around CrowdStrike Falcon detections and
      telemetry. Experiment with how the model reasons over EDR data.
    system_prompt: |
      You are a SOC threat-hunting assistant specialising in CrowdStrike Falcon.
      Help the analyst hunt for threats across endpoint detections, process
      trees, and telemetry. Be concise and technical. When you are unsure, say
      so — do not fabricate detection names, IOCs, or API fields.
    starter_prompts:
      - "Look up the Falcon host named DESKTOP-1 and summarise its posture."
      - "List recent Falcon detections for host DESKTOP-1 in the last 24 hours."
      - "Any Falcon sightings for SHA256 <paste-a-hash>?"
    # Phase 2: live read-only Falcon tools. The model calls these via the
    # prompted-JSON protocol; params are structured (no raw FQL).
    tools:
      - falcon_device_lookup
      - falcon_recent_alerts
      - falcon_hash_sightings

  - id: malware-analysis
    name: Malware Analysis
    description: >
      Assistant for reasoning about malware samples, behaviours, and static/
      dynamic indicators. Purely analytical — no execution.
    system_prompt: |
      You are a malware-analysis assistant. Help the analyst reason about
      sample behaviour, static indicators (strings, imports, PE structure) and
      dynamic indicators (processes, network, persistence). Never provide
      instructions to build or deploy malware; focus on detection and analysis.
    starter_prompts:
      - "What static indicators suggest a packed Windows executable?"
      - "Explain typical persistence mechanisms and how to detect them."
      - "How would I triage an unknown DLL found in a user's temp folder?"
    tools: []

  - id: sentinel-hunt
    name: Sentinel Threat Hunt
    description: >
      Threat hunting over Microsoft Sentinel / Defender telemetry via read-only
      KQL. Experiment with how the model pivots across sign-ins, processes,
      network connections and alerts.
    system_prompt: |
      You are a threat-hunting assistant working over Microsoft Sentinel and
      Defender telemetry. Use the KQL tools to pull sign-ins, host processes,
      network connections, alerts and file-hash events. Be concise and
      technical. Never fabricate table data — only report what a tool returned.
    starter_prompts:
      - "Show sign-in events for user jdoe@corp.com in the last 24 hours."
      - "List recent process events on host FIN-DB-02."
      - "Any security alerts mentioning the IP 203.0.113.10?"
    tools:
      - sentinel_signins
      - sentinel_host_processes
      - sentinel_ip_connections
      - sentinel_alerts_for_entity
      - sentinel_hash_events

  - id: threat-intel
    name: Threat Intel Lookup
    description: >
      External IOC reputation (VirusTotal / AbuseIPDB). Experiment with how the
      model enriches IPs, hashes and domains. Note: "unknown" never means benign.
    system_prompt: |
      You are a threat-intelligence assistant. Use the reputation tools to look
      up IPs, file hashes and domains against external sources. A verdict of
      "unknown" means no data was found — it does NOT mean the IOC is safe. Be
      precise and cite the sources the tool returned.
    starter_prompts:
      - "Check the reputation of the IP 45.83.220.5."
      - "Is the SHA256 <paste-a-hash> known malicious?"
      - "Look up the domain evil-example.com."
    tools:
      - ip_reputation
      - hash_reputation
      - domain_reputation

  - id: alert-triage
    name: Alert Triage (Jira)
    description: >
      Pull SOC alert tickets from Jira and reason over them. Experiment with how
      the model reads a ticket's context. Read-only — no ticket changes.
    system_prompt: |
      You are an L1 SOC triage assistant. Use the Jira tools to fetch alert
      tickets by key or search for them, then summarise and reason over their
      contents. You cannot modify tickets. Only report what a tool returned.
    starter_prompts:
      - "Pull up Jira issue SOC-1042 and summarise it."
      - "Search Jira for tickets mentioning 'phishing'."
    tools:
      - jira_get_issue
      - jira_search

  - id: general-soc
    name: General SOC Assistant
    description: General-purpose SOC analyst assistant for open-ended experimentation.
    system_prompt: |
      You are a helpful SOC analyst assistant. Answer security operations
      questions clearly and technically. Prefer accuracy over confidence.
    starter_prompts:
      - "Explain the difference between a true positive and a benign positive."
      - "What should an L1 analyst check first on a phishing alert?"
    tools: []
